        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .hidden {
                display: none !important;
            }

            .top-dock {
                /* position: fixed; */
                height: 90px;
                width: 100%;
                display: flex;
                flex-direction: column;
                background-color: rgb(63, 63, 63);
                justify-content: center;

                flex-shrink: 0;
            }

            .top-dock-tabsection {
                height: 50%;
                width: 100%;

                display: flex;
                flex-direction: row;
                align-items: center;

                gap: 10px;

                padding: 10px 15px;

                overflow: hidden;
            }
            .top-dock button {
                width: 16px;
                height: 16px;

                flex-shrink: 0;

                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                line-height: 1;
                color: #aaaaaa;
                background-color: inherit;
                border: none;
                border-radius: 40%;
                cursor: pointer;
                transition: background-color 0.1s ease;
            }
            .top-dock button:hover {
                background-color: rgb(82, 82, 82);
            }

            .tabsection-tab {
                font-family: inherit;

                background: inherit;
                padding: 8px 12px;

                width: 180px;
                min-width: 45px;

                flex-grow: 0;
                flex-shrink: 1;

                display: flex;
                align-items: center;
                justify-content: space-between;

                border-radius: 8px;
                border: 1px solid rgba(32, 32, 32, 0.74);
                gap: 10px;
                color: #e0e0e0;
                font-size: 13px;
                cursor: pointer;

                user-select: none;

                transition: background-color 0.15s ease;
            }
            .tabsection-tab[isactive] {
                background-color: rgb(32, 32, 32);
            }
            .tabsection-tab:hover {
                background-color: rgb(56, 56, 56);
            }

            .tabsection-tab img {
                width: 16px;
                height: 16px;
            }
            .tab-name {
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex-grow: 1;
            }

            .top-dock-utilssection {
                height: auto;
                width: 100%;

                display: flex;
                flex-direction: row;
                align-items: center;

                /* border: 1px solid rgba(34, 34, 34, 0.541); */
                border-radius: 6px;
                padding: 10px 15px;
                background-color: rgb(49, 49, 49);

                gap: 40px;
            }
            .top-dock-utilssection input {
                background-color: rgb(31, 31, 31);
                color: #e0e0e0;
                border-radius: 20px;
                height: 100%;
                padding: 5px 10px;
                width: 100%;
                border: none;
            }

            .tab-iframe {
                flex: 1;
                width: 100%;
                background-color: rgb(0, 0, 0);
                border: none;
            }

            .browser-container {
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: 100vw;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <div class="browser-container">
            <div class="top-dock">
                <div class="top-dock-tabsection">

                    <div id="doctabsection" style="display: contents;"></div>

                    <template id="tabtemplate">
                        <div class="tabsection-tab">
                            <img id="tabfavicon">
                            <div class="tab-name">
                                <b id="tabname">fghfghjfgkhgjkghjkghjkffgjhfgjh</b>
                            </div>
                            <button id="closebutton">&times;</button>
                        </div>
                    </template>

                    <button onclick="addTab('New Tab')">+</button>
                </div>
                <div class="top-dock-utilssection">
                    <button onclick="reloadpage()">&#8635;</button>
                    <input type="text" id="urlbar" name="urlbar" placeholder="Search Google or type a URL">
                </div>
            </div>

            <template id="tabiframetemplate">
                <iframe class="tab-iframe" id="tabframe"></iframe>
            </template>

            <div id="iframeplace" style="display: contents;"></div>
            
        </div>

        <script>

            const tabTemplate = document.getElementById("tabtemplate");
            const tabsection = document.getElementById("doctabsection");

            const iframeTemplate = document.getElementById("tabiframetemplate");
            const iframePlace = document.getElementById("iframeplace");

            let tabs = [];
            let tabId = 0;

            let activetab = 0;

            const urlbar = document.getElementById("urlbar");
            urlbar.addEventListener('keydown', function(event) {
                if(event.key === 'Enter')
                {
                    tabs[activetab].taburl = urlbar.value;
                    tabs[activetab].tabframe.src = urlbar.value;
                }
            });

            function reloadpage()
            {
                tabs[activetab].tabframe.src = tabs[activetab].taburl;
            }

            function addTab(url)
            {
                const tab = document.importNode(tabTemplate.content, true);
                const tbi = tabId++;
                
                const tabelm = tab.querySelector(".tabsection-tab");

                tabelm.onclick = function() {setTab(tbi);};

                const img = tab.getElementById("tabfavicon");
                img.src = 'https://lydoyne.monster/lydoynefavicon.svg';

                const tabtitle = tab.getElementById("tabname");
                tabtitle.innerText = url;

                const tabclosebtn = tab.getElementById("closebutton");
                tabclosebtn.onclick = function() {closeTab(tbi, event);};

                const tbfrm = document.importNode(iframeTemplate.content, true);
                const tabiframe = tbfrm.getElementById("tabframe");
                if(url === 'New Tab')
                {
                    tabiframe.src = '';
                }
                else
                {
                    tabiframe.src = url;
                }
                
                tabiframe.classList.add("hidden");

                tabs.push({
                    id: tbi,
                    element: tabelm,
                    tabframe: tabiframe,
                    taburl: ''
                });

                tabsection.appendChild(tab);
                iframePlace.appendChild(tbfrm);
            }

            function closeTab(id, e) 
            {
                if(e)
                {
                    e.stopPropagation();
                }

                tabs[activetab].element.removeAttribute('isactive');
                tabs[activetab].tabframe.classList.add("hidden");

                if(tabs.length !== 1)
                {
                    const ind = tabs.findIndex(item => item.id === id);
                    if(ind !== -1)
                    {
                        tabs[ind].element.remove();
                        tabs.splice(ind,1);
                    }
                }
                
                tabs[0].element.setAttribute('isactive', '');
                tabs[0].tabframe.classList.remove("hidden");
                activetab = 0;
            }

            function setTab(tab)
            {
                tabs[activetab].element.removeAttribute('isactive');
                tabs[activetab].tabframe.classList.add("hidden");
                const ind = tabs.findIndex(item => item.id === tab);
                tabs[ind].element.setAttribute('isactive', '');
                tabs[ind].tabframe.classList.remove("hidden");
                activetab = ind;

                urlbar.value = tabs[activetab].taburl;
            }

            addTab("New Tab");
            tabs[0].element.setAttribute('isactive', '');
            tabs[0].tabframe.classList.remove("hidden");
        </script>
    </body>
</html>
